<!doctype html>
<html lang="en">
  <body style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0F1115;color:#E6E8EC;padding:24px">
    <div style="max-width:560px;margin:0 auto;background:#15181F;border-radius:16px;padding:32px">
      <h1 style="margin:0 0 16px;font-size:20px">Your data export is ready</h1>
      <p style="line-height:1.55;margin:0 0 16px">
        Tap below to download the JSON file with your profile, daily
        logs, events, and insights.
      </p>
      <p style="margin:0 0 24px">
        <a href="{{.DownloadURL}}" style="display:inline-block;background:#A8D548;color:#0F1115;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600">Download my export</a>
      </p>
      <p style="line-height:1.55;color:#9AA0A6;margin:0 0 12px">
        The link expires at {{.ExpiresAt}}. After that, request a new
        export from inside the app.
      </p>
      <p style="margin:24px 0 0;color:#9AA0A6">Neuro</p>
    </div>
  </body>
</html>
