services:
  postgres:
    image: postgres:18-alpine
    container_name: neuronot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuronot
      POSTGRES_PASSWORD: neuronot_dev
      POSTGRES_DB: neuronot
    ports:
      - "5432:5432"
    volumes:
      - neuronot_pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronot -d neuronot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: neuronot_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://neuronot:neuronot_dev@postgres:5432/neuronot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8080"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  neuronot_pg_data:
    name: neuronot_pg_data
