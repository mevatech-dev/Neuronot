services:
  postgres:
    image: postgres:18-alpine
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neuronot
    ports:
      - "5432:5432"
    volumes:
      - neuronot_pg_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuronot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: neuronot_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/neuronot?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CONSENT_KEK: ${CONSENT_KEK:?CONSENT_KEK required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      GOOGLE_OAUTH_AUDIENCES: ${GOOGLE_OAUTH_AUDIENCES:-}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  neuronot_pg_data:
    name: neuronot_pg_data
